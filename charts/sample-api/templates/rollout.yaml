{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: {name: {{ include "sample-api.fullname" . }}}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause: {duration: 60}
      - setWeight: 50
      - pause: {duration: 120}
  selector: {matchLabels: {app.kubernetes.io/name: {{ include "sample-api.name" . }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ include "sample-api.name" . }}}}
    spec:
      serviceAccountName: {{ include "sample-api.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
      - name: api
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports: [{containerPort: 8080}]
        env: [{name: ENVIRONMENT, value: {{ .Values.environment | quote }} }]
        readinessProbe: {httpGet: {path: /ready, port: 8080}}
        livenessProbe: {httpGet: {path: /health, port: 8080}}
        resources: {{- toYaml .Values.resources | nindent 10 }}
{{- end }}
