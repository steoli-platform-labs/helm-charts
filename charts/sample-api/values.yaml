replicaCount: 3
environment: dev
image:
  repository: ghcr.io/steoli-platform-labs/sample-api
  tag: latest
  pullPolicy: IfNotPresent
service: {port: 80, targetPort: 8080}
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 256Mi}
serviceAccount: {create: true, annotations: {}}
autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 10, targetCPUUtilizationPercentage: 70}
rollout: {enabled: true}
secret: {enabled: false, secretStoreName: aws-secrets-manager, remoteKey: solab/sample-api}
